<style>

  --ok:#7fd39f; --ok-soft:#183427; --warn:#f0b75a; --warn-soft:#3a2c12; --danger:#ff8a80; --danger-soft:#3d1a18;
  --rosa:#c0678f; --verde:#4f9a49; --amarela:#b39a1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181b; --surface:#172428; --surface-2:#1f3035; --fg:#e4eef0; --muted:#97abb1; --line:#2c4046;

button.link{background:none;border:0;padding:0;min-height:28px;color:var(--accent);font-weight:600;align-self:flex-start;text-decoration:underline}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
/* Conferência Pedido de Venda x OS (Atenua)
 * Lê o PDF do pedido (gerado pelo sistema, FastReport), extrai os campos que vão para a OS
 * e compara com a OS preenchida no app. Roda no navegador (pdf.js) e no Node (para testes).
 *
 * API:
 *   lerTextoPDF(pdfjsLib, dados)   -> [[linhas da pág 1], [linhas da pág 2], ...]
 *   lerPedido(paginas)             -> objeto do pedido (ver parsePedido)
 *   preencherOS(pedido)            -> {pedido:{...}, itens:[{campos}]} no formato do app-os
 *   conferir(pedido, OS, opcoes)   -> (OS = OS aberta no app: OS.pedido, OS.itens, OS.vendedor) {bloqueios:[], linhas:[{grupo,campo,pedido,os,status,obs}], resumo}
 */
(function (root) {
  "use strict";

  /* ---------- utilidades ---------- */
  const semAcento = s => String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const norm = s => semAcento(s).toUpperCase().replace(/\s+/g, " ").trim();
  const compacto = s => norm(s).replace(/[^A-Z0-9]/g, "");
  const digitos = s => String(s == null ? "" : s).replace(/\D/g, "");
  const tokens = s => norm(s).split(/[^A-Z0-9]+/).filter(t => t.length > 1 && !["DE", "DA", "DO", "DAS", "DOS", "E", "C"].includes(t));
  const vazio = v => v == null || (Array.isArray(v) ? v.length === 0 : String(v).trim() === "");
  function tokensContidos(a, b) { // todos os tokens do menor estão no maior
    const ta = tokens(a), tb = tokens(b);
    if (!ta.length || !tb.length) return false;
    const [menor, maior] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
    return menor.every(t => maior.includes(t));
  }
  const brParaISO = d => { const m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(d || ""); return m ? `${m[3]}-${m[2]}-${m[1]}` : ""; };
  const isoParaBR = d => { const m = /(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : (d || ""); };
  const fmtCEP = c => { const d = digitos(c); return d.length === 8 ? d.slice(0, 5) + "-" + d.slice(5) : d; };
  const fmtTel = t => { const d = digitos(t); if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`; return t || ""; };
  const MINUSC = ["de", "da", "do", "das", "dos", "e", "c/"];
  const titulo = s => String(s == null ? "" : s).replace(/\s+/g, " ").trim().toLowerCase().split(" ")
    .map((w, i) => i && MINUSC.includes(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(" ")
    .replace(/\bRal ?(\d{4})([a-z]?)\b/g, (m, n, l) => "RAL" + n + l.toUpperCase()).replace(/(\d)mm\b/g, "$1 mm");

  /* ---------- 1. texto do PDF, reconstruído em linhas ---------- */
  async function lerTextoPDF(pdfjsLib, dados) {
    const doc = await pdfjsLib.getDocument({ data: dados }).promise;
    const paginas = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const tc = await (await doc.getPage(p)).getTextContent();
      const itens = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ x: i.transform[4], y: i.transform[5], w: i.width, s: i.str }));
      itens.sort((a, b) => b.y - a.y || a.x - b.x);
      const linhas = [];
      for (const it of itens) {
        const l = linhas.find(l => Math.abs(l.y - it.y) <= 3);
        if (l) l.itens.push(it); else linhas.push({ y: it.y, itens: [it] });
      }
      linhas.sort((a, b) => b.y - a.y);
      paginas.push(linhas.map(l => {
        l.itens.sort((a, b) => a.x - b.x);
        let txt = "", fim = null;
        for (const it of l.itens) { if (fim != null) txt += (it.x - fim > 12 ? "   " : it.x - fim > 0.5 ? " " : ""); txt += it.s; fim = it.x + it.w; }
        return txt.replace(/\s+$/, "");
      }));
    }
    return paginas;
  }

  /* ---------- 2. leitura dos campos ---------- */
  const CHAVES_ITEM = { "LINHA": "linha", "MODELO": "modelo", "VIDROS": "vidro", "VIDRO": "vidro", "COR": "cor", "TIPO DE INSTALACAO": "instalacao",
    "MEDIDAS": "medidas", "REFILAMENTO": "refilamento", "CALCO": "calco", "POSICAO DAS FOLHAS": "posFolhas", "CONCHA": "concha" };

  function parsePedido(paginas) {
    const linhasPag = paginas.map(p => p.map(l => l.trim()).filter(Boolean));
    const todas = linhasPag.flat();
    const achar = (re, fonte = todas) => { for (const l of fonte) { const m = re.exec(l); if (m) return m; } return null; };
    const avisos = [];
    const r = { numero: "", revisao: false, dataPedido: "", vendedor: "", cliente: {}, entrega: null, itens: [], totalPecas: null, prazo: null, avisos };

    const mNum = achar(/PPV(R\d*)?\s*-\s*N[ºo°]\s*(\d+)?/i);
    if (mNum) { r.revisao = !!mNum[1]; r.numero = mNum[2] || ""; }
    if (!r.numero) { const i = todas.findIndex(l => /PPV/.test(l)); for (const l of todas.slice(i + 1, i + 5)) { const m = i >= 0 && (/^(\d{3,7})$/.exec(l) || /\s{2,}(\d{3,7})$/.exec(l)); if (m) { r.numero = m[1]; break; } } }
    if (r.revisao) avisos.push("Este é um pedido de revisão/alteração (PPVR), fora do padrão: conferência automática não se aplica.");
    const mData = achar(/Data de abertura do pedido:\s*(\d{2}\/\d{2}\/\d{4})/i); if (mData) r.dataPedido = brParaISO(mData[1]);

    // cabeçalho do cliente: da linha "Cliente:" até "Telefone Contato:" na primeira página
    const p1 = (linhasPag[0] || []).map(l => l.replace(/\s*Projeto\/Obra:.*$/i, "").trim());
    const iCli = p1.findIndex(l => /^Cliente:/i.test(l));
    if (iCli >= 0) {
      const iEnd = p1.findIndex((l, i) => i > iCli && /^Endere[cç]o:/i.test(l));
      const nomeLinhas = p1.slice(iCli, iEnd > iCli ? iEnd : iCli + 1).join(" ").replace(/^Cliente:\s*/i, "");
      const mc = /^(\d+)\s*-\s*(.+)$/.exec(nomeLinhas.trim());
      r.cliente.codigo = mc ? mc[1] : ""; r.cliente.nome = (mc ? mc[2] : nomeLinhas).trim();
      if (iEnd > 0) {
        r.cliente.endereco = p1[iEnd].replace(/^Endere[cç]o:\s*/i, "").trim();
        const mb = /^(.*?)\s*-\s*(.+?)\/([A-Z]{2})\b/.exec(p1[iEnd + 1] || "");
        if (mb) { r.cliente.bairro = mb[1].trim(); r.cliente.cidade = mb[2].trim(); r.cliente.uf = mb[3]; }
      }
      const cab = p1.slice(iCli);
      const g = re => { const m = achar(re, cab); return m ? m[1].trim() : ""; };
      r.cliente.cep = digitos(g(/^CEP:\s*(\d[\d.-]*)/i));
      r.cliente.telefone = g(/^CEP:.*Telefone:\s*(\(?\d[\d()\s-]*\d)/i);
      r.cliente.documento = g(/^CNPJ\/CPF:\s*(\d+)/i);
      r.cliente.contato = g(/^Contato:\s*(.+)$/i);
      r.cliente.email = g(/^E-mail Contato:\s*(\S+)/i).toLowerCase();
      r.cliente.telefoneContato = g(/^Telefone Contato:\s*(\(?\d[\d()\s-]*\d)/i);
    }

    // local de entrega
    const mEnt = achar(/^Local de Entrega:\s*(.*)$/i);
    if (mEnt && mEnt[1].trim()) {
      const t = mEnt[1].trim();
      const m = /^(.*)\s+-\s+(.+?)\/([A-Z]{2})\b.*?CEP:\s*(\d+)/.exec(t);
      if (m) {
        const partes = m[1].split(",").map(s => s.trim());
        const bairro = partes.length >= 3 ? partes.pop() : "";
        r.entrega = { endereco: partes.join(", "), bairro, cidade: m[2].trim(), uf: m[3], cep: m[4], texto: t };
      } else r.entrega = { texto: t };
    }

    // vendedor: linha da assinatura na última página
    const mVend = achar(/^(.+?)\s{2,}Assinatura do Cliente/i, linhasPag[linhasPag.length - 1] || []);
    if (mVend) r.vendedor = mVend[1].trim();

    // observações
    const mPecas = achar(/TOTAL DE PE[CÇ]AS:\s*(\d+)/i); if (mPecas) r.totalPecas = +mPecas[1];
    const mPrazo = achar(/PRAZO DE ENTREGA:\s*(.+)$/i);
    if (mPrazo) {
      const t = mPrazo[1].trim();
      const m = /(\d+)\s*(?:[ÁAÀ]|A|ATE|ATÉ|-)\s*(\d+)\s*DIAS\s*[UÚ]TEIS\s*AP[OÓ]S\s*([^,.]+)/i.exec(t);
      const um = /(\d+)\s*DIAS\s*[UÚ]TEIS\s*AP[OÓ]S\s*([^,.]+)/i.exec(t);
      if (m) r.prazo = { min: +m[1], max: +m[2], marco: m[3].trim(), texto: t };
      else if (um) r.prazo = { min: +um[1], max: +um[1], marco: um[2].trim(), texto: t };
      else r.prazo = { texto: t };
      if (r.prazo.marco) r.prazo.aposMedicao = /^(RE)?MEDI[CÇ][AÃ]O\b/i.test(semAcento(r.prazo.marco).toUpperCase()) || /^(RE)?MEDICAO/.test(compacto(r.prazo.marco));
      r.prazo.remedicao = /REMEDI/.test(norm(t));
    }

    // itens: corpo das páginas (sem cabeçalho e rodapé), cortado em "Código:"
    const corpo = [];
    for (const pg of linhasPag) {
      let i0 = pg.findIndex(l => /^Telefone Contato:/i.test(l)); i0 = i0 >= 0 ? i0 + 1 : 0;
      for (const l of pg.slice(i0)) {
        if (/^_{5,}/.test(l) || /^Rubrica$/i.test(l) || /^Emitente:/i.test(l) || /P[aá]gina \d+ de \d+/.test(l)) continue;
        corpo.push(l);
      }
    }
    let atual = null;
    for (const l of corpo) {
      if (/^C[oó]digo:/i.test(l)) { atual = { codigo: l.replace(/^C[oó]digo:\s*/i, "").trim(), linhas: [] }; r.itens.push(atual); continue; }
      if (/^TOTAL PRODUTO:/i.test(l) || /^Observa[cç][oõ]es:/i.test(l)) { atual = null; continue; }
      if (atual) atual.linhas.push(l);
    }
    r.itens = r.itens.map((it, n) => parseItem(it, n + 1));
    if (!r.revisao && !r.itens.length) avisos.push("Nenhum item encontrado no pedido.");
    return r;
  }

  function parseItem(bruto, n) {
    const it = { n, qtde: 1, descricao: "" };
    let chave = null;
    for (let l of bruto.linhas) {
      const mq = /^(\d+,\d{3})\s*(PC|UN|M2|M²)?\b/i.exec(l);
      if (mq && !it._q) { it.qtde = Math.round(parseFloat(mq[1].replace(",", "."))); it._q = 1; continue; }
      if (/^(UN|PC)$/i.test(l) || /^Item\s*:/i.test(l) || /^CFOP:/i.test(l)) continue;
      const mDim = /Largura:\s*([\d,]+)\s*Altura:\s*([\d,]+)/i.exec(l);
      if (mDim) { it.larguraTotal = Math.round(parseFloat(mDim[1].replace(",", ".")) * 1000); it.alturaTotal = Math.round(parseFloat(mDim[2].replace(",", ".")) * 1000); l = l.slice(0, mDim.index).trim(); if (!l) continue; }
      const md = /^Descri[cç][aã]o:\s*(.*)$/i.exec(l);
      if (md) { const t = md[1]; const mm = /DESCRI[CÇ][AÃ]O\s*:\s*(.*)$/i.exec(t); it.descricao = (mm ? mm[1] : t).trim(); chave = "descricao"; continue; }
      const mk = /^([A-ZÀ-Ú][A-ZÀ-Ú ]+?)\s*:\s*(.*)$/.exec(l);
      const k = mk && CHAVES_ITEM[semAcento(mk[1]).toUpperCase().trim()];
      if (k) { it[k] = mk[2].trim(); chave = k; continue; }
      if (chave) it[chave] = (it[chave] + " " + l).trim();
    }
    delete it._q;
    // medidas: "1410+90 X 1340+90" ou "1700 X 1350"
    const mm = /(\d+)\s*(?:\+\s*(\d+))?\s*[X×]\s*(\d+)\s*(?:\+\s*(\d+))?/i.exec(it.medidas || "");
    if (mm) { it.largura = +mm[1]; it.acrescL = mm[2] ? +mm[2] : 0; it.altura = +mm[3]; it.acrescA = mm[4] ? +mm[4] : 0; }
    it.fixacao = /SOBREPOST/.test(norm(it.instalacao || it.descricao)) ? "Sobreposta" : /EMBUTID/.test(norm(it.instalacao || it.descricao)) ? "Embutida" : "";
    it.tipologia = tipologiaDe(it.modelo || it.descricao);
    const mod = norm(it.modelo);
    it.persiana = /PERSIANA/.test(mod) ? "Sim" : "Não";
    it.acionamento = it.persiana === "Sim" ? (/SMOOVE/.test(mod) ? "Smoove" : /CONTROLE/.test(mod) ? "Controle" : /BOTOEIRA|INTERRUPTOR/.test(mod) ? "Botoeira" : "") : "";
    it.ral = ralDe(it.cor);
    return it;
  }

  function tipologiaDe(txt) {
    const t = norm(txt), num = (/(\d+)\s*FOLHAS?/.exec(t) || [])[1];
    if (/CORRER/.test(t)) return `Correr ${num || 2} folhas`;
    if (/GIRO|ABRIR/.test(t)) return (num || "1") === "1" ? "Giro 1 folha" : "Giro 2 folhas";
    if (/MAXIM/.test(t)) return "Maxim-ar";
    if (/BASCULANTE/.test(t)) return "Basculante";
    if (/PIVOTANTE/.test(t)) return "Pivotante";
    if (/FIXO|FIXA/.test(t)) return "Fixo";
    return "";
  }
  function ralDe(cor) { const m = /RAL\s*(\d{4})\s*([A-Z])?\b/.exec(norm(cor)); return m ? m[1] + (m[2] || "") : ""; }

  /* ---------- 3. pré-preenchimento da OS (formato do app-os) ---------- */
  function preencherOS(p) {
    const c = p.cliente || {}, e = p.entrega && p.entrega.endereco ? p.entrega : null;
    const mesmo = !e || mesmoEndereco(e.endereco, c.endereco);
    const end = mesmo ? (c.endereco || "") : e.endereco;
    const tels = [c.telefoneContato, c.telefone].filter(Boolean).map(digitos).filter((v, i, a) => a.indexOf(v) === i);
    const cel = tels.find(t => t.length === 11) || tels[0] || "";
    const pedido = {
      numPedido: p.numero, dataPedido: p.dataPedido,
      prazo: p.prazo && p.prazo.max ? String(p.prazo.max) : "",
      tipoOS: p.prazo && p.prazo.remedicao ? "Remedição (O.S Rosa)" : "",
      nome: titulo(c.nome), email: c.email || "",
      endereco: titulo(end), bairro: titulo(e ? e.bairro || c.bairro : c.bairro), cidade: titulo(e ? e.cidade : c.cidade), cep: fmtCEP(e ? e.cep : c.cep), uf: (e ? e.uf : c.uf) || "",
      mesmoEnd: mesmo ? "Sim" : "Não", enderecoCli: mesmo ? "" : titulo([c.endereco, c.bairro, c.cidade].filter(Boolean).join(", ")),
      celular: fmtTel(cel), telCom: tels.find(t => t !== cel) ? fmtTel(tels.find(t => t !== cel)) : "", contato: titulo(c.contato),
    };
    const itens = [];
    for (const it of p.itens) for (let k = 0; k < it.qtde; k++) itens.push({ campos: {
      tipologia: it.tipologia || "Outra", tipoOutra: it.tipologia ? "" : titulo(it.modelo || it.descricao),
      largura: it.largura ? String(it.largura) : "", altura: it.altura ? String(it.altura) : "",
      acrescimo: it.acrescL || it.acrescA ? "Sim" : (it.medidas ? "Não" : ""), folgaL: it.acrescL ? String(it.acrescL) : "", folgaA: it.acrescA ? String(it.acrescA) : "",
      calco: simNao(it.calco), linha: titulo(it.linha), vidro: titulo(it.vidro), cor: titulo(it.cor),
      posFolhas: titulo(it.posFolhas), concha: titulo(it.concha), persiana: it.persiana, acion: it.acionamento, fixacao: it.fixacao,
      refilar: simNao(it.refilamento),
    }, origem: { itemPedido: it.n, unidade: k + 1, de: it.qtde } });
    return { pedido, itens };
  }
  const simNao = v => /^S/i.test(norm(v)) ? "Sim" : /^N/i.test(norm(v)) ? "Não" : "";
  function mesmoEndereco(a, b) {
    const ra = /^(.*?)[,\s]+(\d+)/.exec(norm(a)), rb = /^(.*?)[,\s]+(\d+)/.exec(norm(b));
    if (!ra || !rb) return compacto(a) === compacto(b);
    return ra[2] === rb[2] && tokensContidos(ra[1], rb[1]);
  }

  /* ---------- 4. conferência ---------- */
  // os = estado do app-os: {pedido:{...}, itens:[{campos:{...}}], user:{nome}}
  function conferir(p, os, opcoes = {}) {
    const tol = opcoes.toleranciaMM != null ? opcoes.toleranciaMM : 10;
    const linhas = [], bloqueios = [];
    const add = (grupo, campo, vp, vo, status, obs) => linhas.push({ grupo, campo, pedido: vp == null ? "" : String(vp), os: vo == null ? "" : String(vo), status, obs: obs || "" });
    const cmp = (grupo, campo, vp, vo, igual, obs) => {
      if (vazio(vp)) return add(grupo, campo, "(não consta no pedido)", vo, "info", obs);
      if (vazio(vo)) return add(grupo, campo, vp, "(vazio)", "falta", obs);
      add(grupo, campo, vp, vo, igual(vp, vo) ? "ok" : "diverge", obs);
    };
    const eqTxt = (a, b) => compacto(a) === compacto(b) || tokensContidos(a, b);
    const O = (os && os.pedido) || {}, c = p.cliente || {};

    if (p.revisao) { bloqueios.push("Pedido de revisão (PPVR): não é o padrão de pedido. Anexe o pedido original."); return fechar(); }

    /* pedido */
    cmp("Pedido", "Nº do pedido", p.numero, O.numPedido, (a, b) => digitos(a) === digitos(b));
    cmp("Pedido", "Data do pedido", isoParaBR(p.dataPedido), isoParaBR(O.dataPedido), (a, b) => a === b);
    const vendOS = os && (os.vendedor || (os.user && os.user.nome));
    if (p.vendedor) cmp("Pedido", "Vendedor", p.vendedor, vendOS, tokensContidos, "Nome acima da assinatura do pedido x vendedor da OS");

    // prazo: obrigatório, contado após medição, e a OS dentro da faixa
    const pz = p.prazo;
    if (!pz || !pz.max) bloqueios.push("O pedido não tem o prazo de entrega no formato \"X a Y dias úteis após medição\". Corrija o pedido antes de emitir a OS.");
    else if (!pz.aposMedicao) bloqueios.push(`O prazo do pedido é contado "após ${pz.marco.toLowerCase()}", e não após a medição. Corrija o pedido antes de emitir a OS.`);
    if (pz && pz.max) {
      const faixa = pz.min === pz.max ? `${pz.max} dias úteis` : `${pz.min} a ${pz.max} dias úteis`;
      if (vazio(O.prazo)) add("Pedido", "Prazo de entrega", faixa, "(vazio)", "falta", pz.texto);
      else add("Pedido", "Prazo de entrega", faixa, `${O.prazo} dias úteis`, (+O.prazo >= pz.min && +O.prazo <= pz.max) ? "ok" : "diverge", pz.texto);
    }
    if (pz && pz.remedicao) cmp("Pedido", "Tipo de OS", "Remedição (O.S Rosa)", O.tipoOS, (a, b) => /REMEDI/.test(norm(b)) && !/SEM/.test(norm(b)), "O prazo do pedido cita remedição");

    /* cliente */
    cmp("Cliente", "Nome", c.nome, O.nome, eqTxt);
    cmp("Cliente", "E-mail", c.email, O.email, (a, b) => norm(a) === norm(b));
    const telsP = [c.telefone, c.telefoneContato].map(digitos).filter(Boolean);
    const telsO = [O.celular, O.telCom, O.telRes].map(digitos).filter(Boolean);
    if (telsP.length) {
      if (!telsO.length) add("Cliente", "Telefone", telsP.map(fmtTel).join(" / "), "(vazio)", "falta");
      else add("Cliente", "Telefone", [...new Set(telsP)].map(fmtTel).join(" / "), telsO.map(fmtTel).join(" / "), telsP.some(t => telsO.includes(t)) ? "ok" : "diverge", "Pelo menos um telefone do pedido precisa estar na OS");
    }
    const E = p.entrega && p.entrega.endereco ? p.entrega : { endereco: c.endereco, bairro: c.bairro, cidade: c.cidade, uf: c.uf, cep: c.cep };
    const obsEnt = p.entrega && p.entrega.endereco ? (mesmoEndereco(p.entrega.endereco, c.endereco) ? "" : `Atenção: o local de entrega é diferente do endereço do cliente (${c.endereco})`) : "Pedido sem local de entrega; usado o endereço do cliente";
    cmp("Entrega", "Endereço de instalação", E.endereco, O.endereco, mesmoEndereco, obsEnt);
    cmp("Entrega", "Bairro", E.bairro, O.bairro, eqTxt);
    cmp("Entrega", "Cidade", E.cidade, O.cidade, eqTxt);
    cmp("Entrega", "CEP", fmtCEP(E.cep), O.cep, (a, b) => digitos(a) === digitos(b));
    cmp("Entrega", "UF", E.uf, O.uf, (a, b) => norm(a) === norm(b));

    /* itens */
    const unidades = [];
    for (const it of p.itens) for (let k = 0; k < it.qtde; k++) unidades.push({ it, k });
    // usa a versão liberada do item, se houver; senão a do remedidor; senão a do vendedor
    const camposDe = x => { const v = x.final || x.remed; return (v && (v.campos || v)) || x.campos || {}; };
    const itensOS = ((os && os.itens) || []).map((x, i) => ({ i, d: camposDe(x) }));
    const totalPedido = p.totalPecas != null ? p.totalPecas : unidades.length;
    add("Itens", "Quantidade de peças", totalPedido, itensOS.length, totalPedido === itensOS.length ? "ok" : "diverge",
      p.totalPecas != null && p.totalPecas !== unidades.length ? `Observações dizem ${p.totalPecas} peças, itens somam ${unidades.length}` : "");

    // casa cada peça do pedido com o item da OS mais parecido
    const livres = itensOS.slice();
    for (const u of unidades) {
      let melhor = null, nota = -1;
      for (const o of livres) { const s = semelhanca(u.it, o.d, tol); if (s > nota) { nota = s; melhor = o; } }
      const g = `Item ${u.it.n}${u.it.qtde > 1 ? ` (peça ${u.k + 1} de ${u.it.qtde})` : ""}${melhor ? ` × OS item ${melhor.i + 1}${melhor.d.ambiente ? " – " + melhor.d.ambiente : ""}` : ""}`;
      if (!melhor) { add(g, "Peça do pedido", `${u.it.tipologia || u.it.descricao} ${u.it.medidas || ""}`, "(sem item correspondente na OS)", "falta"); continue; }
      livres.splice(livres.indexOf(melhor), 1);
      conferirItem(u.it, melhor.d, g, cmp, add, tol);
    }
    for (const o of livres) add(`OS item ${o.i + 1}${o.d.ambiente ? " – " + o.d.ambiente : ""}`, "Item da OS", "(não existe no pedido)", `${o.d.tipologia || ""} ${o.d.largura || ""}×${o.d.altura || ""}`, "diverge");

    return fechar();

    function fechar() {
      const cont = s => linhas.filter(l => l.status === s).length;
      const resumo = { ok: cont("ok"), diverge: cont("diverge"), falta: cont("falta"), info: cont("info"), bloqueios: bloqueios.length };
      resumo.aprovado = !resumo.diverge && !resumo.falta && !resumo.bloqueios;
      return { pedido: p.numero, bloqueios, avisos: p.avisos || [], linhas, resumo };
    }
  }

  function conferirItem(it, d, g, cmp, add, tol) {
    const eqTxt = (a, b) => compacto(a) === compacto(b) || tokensContidos(a, b);
    const tipoOS = d.tipologia === "Outra" ? d.tipoOutra : d.tipologia;
    cmp(g, "Tipologia", it.tipologia || it.modelo, tipoOS, (a, b) => it.tipologia ? norm(a) === norm(b) : eqTxt(a, b), it.modelo);
    cmp(g, "Linha", it.linha, d.linha, eqTxt);
    cmp(g, "Vidro", it.vidro, d.vidro, eqTxt);
    cmp(g, "Cor", it.cor, d.cor, (a, b) => it.ral ? ralDe(b) === it.ral : eqTxt(a, b), it.ral ? "Compara o código RAL" : "");
    cmp(g, "Instalação", it.fixacao, d.fixacao, (a, b) => norm(a) === norm(b));
    const mm = (vp, vo) => Math.abs(+vp - +digitos(vo)) <= tol;
    cmp(g, "Largura (sem acréscimo)", it.largura, d.largura, mm, `Tolerância ±${tol} mm`);
    cmp(g, "Altura (sem acréscimo)", it.altura, d.altura, mm, `Tolerância ±${tol} mm`);
    const acrP = it.acrescL || it.acrescA ? `+${it.acrescL} / +${it.acrescA} mm` : "Sem acréscimo";
    const acrO = d.acrescimo === "Sim" ? `+${d.folgaL || 0} / +${d.folgaA || 0} mm` : d.acrescimo === "Não" ? "Sem acréscimo" : "";
    if (it.medidas) cmp(g, "Acréscimo (largura / altura)", acrP, acrO, (a, b) => a === b);
    if ((d.fixacao === "Sobreposta" || it.fixacao === "Sobreposta") && d.acrescimo !== "Sim")
      add(g, "Regra: sobreposta tem acréscimo", "Sobreposta", d.acrescimo === "Não" ? "Sem acréscimo" : "(vazio)", "diverge", "Peça sobreposta precisa de acréscimo nas medidas");
    cmp(g, "Persiana", it.persiana, d.persiana, (a, b) => a === b);
    if (it.persiana === "Sim" && it.acionamento) cmp(g, "Acionamento da persiana", it.acionamento, d.acion, (a, b) => a === b);
    cmp(g, "Calço", simNao(it.calco), d.calco, (a, b) => a === b);
    if (it.refilamento) {
      const semCM = !d.contramarco || d.contramarco === "Sem contramarco";
      if (semCM && simNao(it.refilamento) === "Não") add(g, "Refilamento", "Não", d.contramarco ? "Sem contramarco" : "(contramarco vazio)", d.contramarco ? "ok" : "info");
      else cmp(g, "Refilamento", simNao(it.refilamento), semCM ? "Sem contramarco" : d.refilar, (a, b) => a === b);
    }
    cmp(g, "Posição das folhas", it.posFolhas, d.posFolhas, eqTxt);
    cmp(g, "Concha", it.concha, d.concha, eqTxt);
  }

  function semelhanca(it, d, tol) {
    let s = 0;
    if (it.largura && Math.abs(it.largura - +digitos(d.largura)) <= tol) s += 3;
    if (it.altura && Math.abs(it.altura - +digitos(d.altura)) <= tol) s += 3;
    if (it.tipologia && norm(it.tipologia) === norm(d.tipologia)) s += 2;
    if (it.fixacao && it.fixacao === d.fixacao) s += 1;
    if (it.persiana === d.persiana) s += 1;
    if (it.linha && compacto(it.linha) === compacto(d.linha)) s += 1;
    return s;
  }

  const api = { lerTextoPDF, parsePedido, lerPedido: parsePedido, preencherOS, conferir, _util: { norm, compacto, tipologiaDe, ralDe, mesmoEndereco } };
  if (typeof module === "object" && module.exports) module.exports = api;
  root.ConferenciaPedido = api;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>

let ultimaPos=null;
function getPos(timeout=8000){
  return new Promise(res=>{
    if(ultimaPos && Date.now()-ultimaPos.t<120000) return res(ultimaPos.p);
    if(!navigator.geolocation) return res({erro:"Este aparelho não informa localização"});
    try{ navigator.geolocation.getCurrentPosition(
      p=>{ const r={lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy)}; ultimaPos={t:Date.now(),p:r}; res(r); },
      e=>res({erro: PREVIEW ? "Localização indisponível nesta pré-visualização" : e.code===1 ? "Permissão de localização negada" : "Não foi possível obter a localização"}),
      {enableHighAccuracy:true,timeout,maximumAge:60000});
    }catch(e){ res({erro:"Localização indisponível"}); }
  });
}

/* ---------- desenho das tipologias ---------- */
function drawTipo(cv,tipo,opts={}){
  const c=cv.getContext("2d"), W=cv.width, H=cv.height;
  const ink=opts.ink||"#1b2a30", glass=opts.glass||"#d4ecf0";
  c.clearRect(0,0,W,H); if(opts.bg){ c.fillStyle=opts.bg; c.fillRect(0,0,W,H); }
  const p=Math.round(Math.min(W,H)*0.06), x0=p,y0=p,w=W-2*p,hh=H-2*p;
  const lw=Math.max(1.5,Math.min(W,H)/110), fr=Math.max(3,Math.min(W,H)/28);
  c.lineWidth=lw; c.strokeStyle=ink; c.fillStyle=ink; c.lineJoin="round";
  c.strokeRect(x0,y0,w,hh); c.strokeRect(x0+fr,y0+fr,w-2*fr,hh-2*fr);
  const ix=x0+fr,iy=y0+fr,iw=w-2*fr,ih=hh-2*fr;
  const ln=(a,b,x,y,dash)=>{ c.save(); if(dash) c.setLineDash([lw*3,lw*2.5]); c.beginPath(); c.moveTo(a,b); c.lineTo(x,y); c.stroke(); c.restore(); };
  const pane=(x,y,ww,hh2)=>{ const g=fr*.5; c.save(); c.fillStyle=glass; c.fillRect(x+g,y+g,ww-2*g,hh2-2*g); c.restore(); c.strokeRect(x+g,y+g,ww-2*g,hh2-2*g); return [x+g,y+g,ww-2*g,hh2-2*g]; };
  const arrow=(cx,cy,dir,len)=>{ const a=len/2, s=Math.max(4,len*.28); const pts=dir===0?[[-a,0],[a,0]]:[[-a*dir,0],[a*dir,0]]; ln(cx+pts[0][0],cy,cx+pts[1][0],cy); const heads=dir===0?[-1,1]:[dir]; for(const d of heads){ c.beginPath(); c.moveTo(cx+a*d,cy); c.lineTo(cx+(a-s)*d,cy-s*.6); c.lineTo(cx+(a-s)*d,cy+s*.6); c.closePath(); c.fill(); } };
  const n={"Correr 2 folhas":2,"Correr 3 folhas":3,"Correr 4 folhas":4}[tipo];
  if(n){ const pw=iw/n; for(let i=0;i<n;i++){ pane(ix+i*pw,iy,pw,ih); const dir = n===3 ? (i===0?1:i===2?-1:0) : (i<n/2?1:-1); arrow(ix+(i+.5)*pw,iy+ih/2,dir,Math.min(pw*.45,ih*.4)); } return; }
  if(tipo==="Giro 1 folha"){ const [x,y,ww,h2]=pane(ix,iy,iw,ih); ln(x+ww,y,x,y+h2/2,true); ln(x+ww,y+h2,x,y+h2/2,true); return; }
  if(tipo==="Giro 2 folhas"){ for(let i=0;i<2;i++){ const [x,y,ww,h2]=pane(ix+i*iw/2,iy,iw/2,ih); const hx=i===0?x+ww:x, ox=i===0?x:x+ww; ln(ox,y,hx,y+h2/2,true); ln(ox,y+h2,hx,y+h2/2,true);} return; }
  if(tipo==="Maxim-ar"){ const [x,y,ww,h2]=pane(ix,iy,iw,ih); ln(x,y,x+ww/2,y+h2,true); ln(x+ww,y,x+ww/2,y+h2,true); return; }
  if(tipo==="Basculante"){ const [x,y,ww,h2]=pane(ix,iy,iw,ih); ln(x,y+h2/2,x+ww,y+h2/2,true); ln(x,y,x+ww/2,y+h2/2); ln(x+ww,y,x+ww/2,y+h2/2); return; }
  if(tipo==="Pivotante"){ const [x,y,ww,h2]=pane(ix,iy,iw,ih); ln(x+ww*.3,y-fr*.3,x+ww*.3,y+h2+fr*.3,true); c.beginPath(); c.arc(x+ww*.3,y+h2/2,Math.min(ww,h2)*.08,0,Math.PI*2); c.stroke(); return; }
  const [x,y,ww,h2]=pane(ix,iy,iw,ih);
  c.font=`600 ${Math.round(Math.min(ww,h2)*.18)}px sans-serif`; c.textAlign="center"; c.textBaseline="middle"; c.fillStyle=ink;
  c.fillText(tipo==="Fixo"?"FIXO":"?",x+ww/2,y+h2/2);
}

function fechoDe(txt){
  const u=String(txt||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
  if(!u.trim()) return {};
  const op=/CEGA/.test(u)?"Concha cega":/LEVE\s*TOQUE/.test(u)?"Concha leve toque":/CREMONA/.test(u)?"Cremona":/SEM\s*MOLA/.test(u)?"Concha com trava sem mola":/MOLA/.test(u)?"Concha com trava e mola":"Outro";

  if(d.corTipo==="Pintura eletrostática"){ const r=String(d.corRal||"").replace(/\D/g,""); return ["Pintura eletrostática",r?`RAL${r}${d.corBrilho==="Brilhante"?"B":d.corBrilho==="Fosco"?"F":""}`:"",b?`(${b})`:""].filter(Boolean).join(" "); }
  return d.cor||"";

function corPartes(txt){
  const t=String(txt||""), u=t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
  if(/ANODIZ/.test(u)){ const resto=t.replace(/anodiza[çc][ãa]o/i,"").replace(/\b(fosc[oa]|brilhante)\b/ig,"").trim(); return {corTipo:"Anodização",corAnod:resto?resto[0].toUpperCase()+resto.slice(1).toLowerCase():"",corBrilho:/FOSC/.test(u)?"Fosco":/BRILHANTE/.test(u)?"Brilhante":""}; }
  const m=/RAL\s*(\d{4})\s*([BF])?\b/.exec(u);
  if(/PINTURA|RAL/.test(u)) return {corTipo:"Pintura eletrostática",corRal:m?m[1]:"",corBrilho:m&&m[2]==="B"||/BRILHANTE/.test(u)?"Brilhante":m&&m[2]==="F"||/FOSC/.test(u)?"Fosco":""};

function validar(schema,d){

    if(vazio){ if(!f.opt) m="Preencha este campo"; }
    else if(f.t==="email" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) m="E-mail inválido";
    else if(f.t==="cep" && !/^\d{5}-\d{3}$/.test(v)) m="O CEP tem 8 dígitos";
    else if(f.t==="tel" && v.replace(/\D/g,"").length<10) m="Inclua o DDD";

async function enviarRemedicao(btn){
  const o=OS;
  btn.disabled=true; btn.textContent="Obtendo localização…";
  const gps=await getPos(10000);
  if(EXIGE_GPS&&gps.lat==null){ btn.disabled=false; btn.textContent="Finalizar remedição"; toast(`${gps.erro}. Ative a localização do celular para finalizar.`); return; }
  const agora=new Date().toISOString();
  o.remedicao={por:S.user.nome,em:agora,gps:gps.lat!=null?gps:null,gpsErro:gps.erro||null};
  o.itens.forEach(it=>{ it.remed.campos.dataMed=agora.slice(0,10); it.remed.campos.respMed=S.user.nome; });
  gerarAvisos(o);
  const n=o.avisos.length;
  hist(o,`Remedição finalizada (${n?n+" aviso"+(n>1?"s":"")+" de diferença":"sem diferenças"})`);
  if(!n) aplicarFinal(o,"Liberada automaticamente: remedição sem diferenças");

  o.atualizadaEm=agora; salvar(); S.view=o.status==="pendencias"?"remedicao":"os"; render(); scrollTo(0,0);

function gerarAvisos(o){

async function emitir(btn){

  btn.textContent="Montando o PDF…";
  await new Promise(r=>setTimeout(r,30));
  const em={por:S.user.nome,em:new Date().toISOString(),gps:gps.lat!=null?gps:null,gpsErro:gps.erro||null};
  let doc;
  try{ doc=montarPDF(em); }catch(e){ console.error(e); btn.disabled=false; btn.textContent="Finalizar e gerar OS (PDF)"; toast("Não consegui montar o PDF. Tente de novo."); return; }
  const nome=`OS ${OS.pedido.numPedido} - ${OS.pedido.nome}`.replace(/[\\/:*?"<>|]/g,"").slice(0,120)+".pdf";
  em.paginas=doc.getNumberOfPages(); em.arquivo=nome;
  const blob=doc.output("blob");
  const r=await salvarArquivo(blob,nome);

    hist(OS,"OS emitida pelo vendedor"+(OS.conferencia?(OS.conferencia.diferencas.length?` com ${OS.conferencia.diferencas.length} diferença(s) do pedido. Justificativa: ${OS.conferencia.justificativa}`:" (confere com o pedido de venda)")+((OS.conferencia.avisos||[]).length?". Aviso: prazo do pedido não conta da medição":""):""));
    if(OS.pedido.tipoOS==="Remedição (O.S Rosa)"){ const d=USUARIOS.find(x=>x.distribui); OS.remedidor=d.nome; OS.status="em_remedicao"; hist(OS,`Remedição enviada automaticamente para ${d.nome}`); }
    else { OS.status="liberada"; OS.liberacao={por:S.user.nome,em:em.em,motivo:"OS sem remedição: liberada para projeto"}; hist(OS,OS.liberacao.motivo); }
  }
  OS.atualizadaEm=em.em; salvar(); S.view="os"; render(); scrollTo(0,0);
  toast(r==="declined"?"Download cancelado. Dá para baixar de novo nesta tela.":`PDF gerado: ${nome}`);
}
async function salvarArquivo(blob,nome){
  try{ if(window.claude&&window.claude.use){ const dl=await window.claude.use("downloads"); if(dl){ await dl.save({filename:nome,data:blob}); return "ok"; } } }
  catch(e){ if(e&&e.code==="declined") return "declined"; }
  const a=h("a",{href:URL.createObjectURL(blob),download:nome}); document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); return "ok";
}
